<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" font-family="'Segoe UI',Roboto,Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect width="1100" height="300" fill="#0d1117"/>
  <text x="40" y="48" fill="#e6edf3" font-size="24" font-weight="700">How it works</text>

  <!-- step 1 -->
  <g transform="translate(40,90)">
    <rect width="200" height="120" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="100" y="40" text-anchor="middle" fill="#58a6ff" font-size="18" font-weight="700">1 · Server IP</text>
    <text x="100" y="72" text-anchor="middle" fill="#8b949e" font-size="15">you provide</text>
    <text x="100" y="96" text-anchor="middle" fill="#e6edf3" font-size="16" font-family="monospace">72.60.89.132</text>
  </g>
  <line x1="245" y1="150" x2="295" y2="150" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- step 2 -->
  <g transform="translate(300,90)">
    <rect width="220" height="120" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="110" y="40" text-anchor="middle" fill="#58a6ff" font-size="18" font-weight="700">2 · Reverse-IP</text>
    <text x="110" y="70" text-anchor="middle" fill="#8b949e" font-size="15">HackerTarget API</text>
    <text x="110" y="96" text-anchor="middle" fill="#e6edf3" font-size="15">→ all domains on IP</text>
  </g>
  <line x1="525" y1="150" x2="575" y2="150" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- step 3 -->
  <g transform="translate(580,90)">
    <rect width="240" height="120" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="120" y="40" text-anchor="middle" fill="#58a6ff" font-size="18" font-weight="700">3 · Fingerprint</text>
    <text x="120" y="68" text-anchor="middle" fill="#3fb0d6" font-size="14">wp-content · /wp-json</text>
    <text x="120" y="90" text-anchor="middle" fill="#f4a321" font-size="14">com_ · /administrator/</text>
  </g>
  <line x1="825" y1="150" x2="875" y2="150" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- step 4 -->
  <g transform="translate(880,90)">
    <rect width="180" height="120" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="90" y="40" text-anchor="middle" fill="#3fb950" font-size="18" font-weight="700">4 · Output</text>
    <text x="90" y="72" text-anchor="middle" fill="#8b949e" font-size="15">matches →</text>
    <text x="90" y="96" text-anchor="middle" fill="#e6edf3" font-size="15" font-family="monospace">sites.txt</text>
  </g>
</svg>
