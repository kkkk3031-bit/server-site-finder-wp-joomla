<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" font-family="'Segoe UI',Roboto,Arial,sans-serif">
  <rect width="820" height="320" fill="#0d1117"/>
  <text x="40" y="48" fill="#e6edf3" font-size="24" font-weight="700">Detection fingerprints</text>

  <!-- WordPress card -->
  <g transform="translate(40,80)">
    <rect width="360" height="210" rx="14" fill="#161b22" stroke="#3fb0d6" stroke-width="2"/>
    <circle cx="38" cy="46" r="20" fill="#21759b"/>
    <text x="38" y="53" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">W</text>
    <text x="72" y="42" fill="#e6edf3" font-size="22" font-weight="700">WordPress</text>
    <text x="72" y="64" fill="#8b949e" font-size="14">homepage + /wp-login.php</text>
    <g font-family="monospace" font-size="15" fill="#3fb0d6">
      <text x="28" y="104">• wp-content / wp-includes</text>
      <text x="28" y="132">• /wp-json</text>
      <text x="28" y="160">• content="WordPress"</text>
      <text x="28" y="188">• user_login · wp-submit</text>
    </g>
  </g>

  <!-- Joomla card -->
  <g transform="translate(420,80)">
    <rect width="360" height="210" rx="14" fill="#161b22" stroke="#f4a321" stroke-width="2"/>
    <circle cx="38" cy="46" r="20" fill="#f4a321"/>
    <text x="38" y="53" text-anchor="middle" fill="#0d1117" font-size="22" font-weight="700">J</text>
    <text x="72" y="42" fill="#e6edf3" font-size="22" font-weight="700">Joomla</text>
    <text x="72" y="64" fill="#8b949e" font-size="14">homepage + /administrator/</text>
    <g font-family="monospace" font-size="15" fill="#f4a321">
      <text x="28" y="104">• option=com_ · com_content</text>
      <text x="28" y="132">• /media/system/js</text>
      <text x="28" y="160">• /administrator/</text>
      <text x="28" y="188">• Joomla generator tag</text>
    </g>
  </g>
</svg>
